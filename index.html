<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат с ФРТОШКОЙ</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/widget.css">
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(900px 480px at 85% 100%, rgba(33, 64, 145, 0.08), transparent 62%),
        #eef2fb;
      color: #1a2540;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    }

    .page {
      box-sizing: border-box;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .page p {
      margin: 0;
      color: #5a6a8a;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="page">
    <p>ФРТ</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
